<body><div id="launch" role="status" aria-label="TONIX"><div class="launch-mark"><div class="launch-core" aria-hidden="true"></div><div class="launch-name">TONIX</div></div><div class="launch-error" id="launchError"><strong>Не удалось загрузить TONIX</strong><p id="launchErrorText">Проверьте соединение и попробуйте ещё раз.</p><button type="button" data-action="retry-load">Повторить</button></div></div><main id="app"><header><button class="profile-mini" data-action="account"><div class="avatar" id="miniAvatar">T</div><b id="miniName">Профиль</b></button><div class="brand">TONIX</div><button class="balance-pill" data-action="wallet"><div><span id="headerBalance" data-balance-value>—</span><small>USDT</small></div></button></header><section id="screen" class="screen"></section><div id="swipePreview" class="swipe-preview" aria-hidden="true" inert></div></main><nav class="nav" aria-label="Навигация"><button class="nav-btn active" data-tab="home"><span>⌂</span>Главная</button><button class="nav-btn" data-tab="history"><span>↺</span>История</button><button class="nav-btn" data-tab="exchange"><span>⇄</span>Обмен</button></nav><div id="toast" class="toast" role="status"></div><div id="modal"></div>
<script>
(()=>{'use strict';
const CONFIG=Object.freeze({BOT_USERNAME:'TONIX1Bot',CHANNEL_URL:'https://t.me/+fqjZMfXpFgxiZmQy',REVIEWS_URL:'https://t.me/+PwiKpyE0oylkY2Ji',API_URL:'https://klfdfbln.onrender.com'});
let tg=window.Telegram?.WebApp;let telegramInitialized=false;const $=s=>document.querySelector(s);const state={screen:'home',stack:[],user:null,balance:0,reserved:0,stats:{transactionsCount:0,usdtTurnover:0,rubTurnover:0},history:[],rate:null,balanceAnimationFrom:null,amount:'',card:'',check:'',loading:false,api:false};
const fmt=(n,d=2)=>new Intl.NumberFormat('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d}).format(Number(n)||0);const parseMicro=value=>{const m=/^(\d+)(?:\.(\d{1,6}))?$/.exec(String(value??'').trim().replace(',','.'));return m?BigInt(m[1])*1000000n+BigInt((m[2]||'').padEnd(6,'0')||'0'):null};const rateKopeks=()=>{const m=/^(\d+)(?:\.(\d{1,2}))?$/.exec(String(state.rate??''));return m?BigInt(m[1])*100n+BigInt((m[2]||'').padEnd(2,'0')||'0'):0n};const rubText=value=>{const micro=parseMicro(value),rate=rateKopeks();if(micro===null||!rate)return fmt(0,0)+' ₽';const kopeks=(micro*rate+500000n)/1000000n;return fmt(Number(kopeks)/100,0)+' ₽'};const availableMicro=()=>{const b=parseMicro(state.balance)||0n,r=parseMicro(state.reserved)||0n;return b>r?b-r:0n};const formatMicro=value=>{const whole=value/1000000n,fraction=String(value%1000000n).padStart(6,'0').replace(/0+$/,'');return fraction?`${whole}.${fraction}`:String(whole)};const availableBalance=()=>Number(availableMicro())/1000000;const haptic=(kind='light')=>{try{tg?.HapticFeedback?.impactOccurred(kind)}catch{}};const toast=(s)=>{const el=$('#toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)};
function initTelegram(){if(!tg||telegramInitialized)return;telegramInitialized=true;tg.ready();tg.expand();tg.setHeaderColor?.('#08090c');tg.setBackgroundColor?.('#08090c');tg.onEvent?.('themeChanged',applyTheme);tg.onEvent?.('viewportChanged',()=>document.documentElement.style.setProperty('--tg-viewport-height',(tg.viewportStableHeight||tg.viewportHeight)+'px'));if(tg.BackButton){tg.BackButton.onClick(back);tg.BackButton.show()}applyTheme();}
function applyTheme(){/* TONIX keeps its own dark palette across Telegram themes. */}

const api=async(path,body)=>{if(!CONFIG.API_URL)return null;const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),20000);const init={method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''},signal:controller.signal,...(body?{body:JSON.stringify(body)}:{})};let r;try{r=await fetch(CONFIG.API_URL.replace(/\/$/,'')+path,init)}catch{throw new Error('Не удалось связаться с API. Проверьте соединение, Render и CORS.')}finally{clearTimeout(timeout)}const data=await r.json().catch(()=>({error:'Ошибка ответа сервера'}));if(!r.ok)throw new Error((data.error||'Не удалось выполнить запрос')+(data.requestId?` · ID ${data.requestId}`:''));return data};
async function load(){tg=window.Telegram?.WebApp||tg;initTelegram();const launch=$('#launch'),error=$('#launchError'),retry=$('[data-action="retry-load"]');retry.disabled=true;error.classList.remove('show');$('#launchErrorText').textContent='Проверьте соединение и попробуйте ещё раз.';launch.setAttribute('aria-busy','true');try{const data=await api('/api/me');if(!data)throw new Error('Сервис TONIX временно недоступен.');if(!Number.isFinite(Number(data.rate))||Number(data.rate)<=0)throw new Error('Не удалось получить текущий курс. Попробуйте ещё раз.');state.api=true;state.user=data.user;state.balance=data.wallet.balanceUSDT;state.reserved=data.wallet.reservedUSDT;state.stats=data.statistics;state.history=data.history||[];state.rate=Number(data.rate);try{state.card=localStorage.getItem('tonix_card')||''}catch{}render();document.body.classList.add('ready');launch.classList.add('is-exiting');setTimeout(()=>{launch.hidden=true;launch.classList.remove('is-exiting');launch.removeAttribute('aria-busy')},260);if(tg?.HapticFeedback){try{if(!sessionStorage.getItem('tonix_launch_haptic')){tg.HapticFeedback.impactOccurred('light');sessionStorage.setItem('tonix_launch_haptic','1')}}catch{}}}catch(e){retry.disabled=false;$('#launchErrorText').textContent=e.message||'Проверьте соединение и попробуйте ещё раз.';error.classList.add('show');launch.setAttribute('aria-busy','false')}}
async function refreshAccount(){try{const data=await api('/api/me');if(!data||!Number.isFinite(Number(data.rate)))return;const oldBalance=state.balance;state.user=data.user;state.balance=data.wallet.balanceUSDT;state.reserved=data.wallet.reservedUSDT;state.stats=data.statistics;state.history=data.history||[];state.rate=Number(data.rate);if(oldBalance!==state.balance)state.balanceAnimationFrom=oldBalance;render()}catch{}}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state.api)refreshAccount()});function avatarMarkup(user,large=false){const cls=large?'avatar':'avatar';return user.avatar?`<div class="${cls}"><img src="${esc(user.avatar)}" alt=""></div>`:`<div class="${cls}">${esc((user.firstName||'T').slice(0,1).toUpperCase())}</div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(name,fromNav=false){if(!['home','exchange','history'].includes(state.screen))state.stack.push(state.screen);state.screen=name;if(fromNav)state.stack=[];haptic();render();window.scrollTo({top:0,behavior:'smooth'});}
function back(){if(state.stack.length)state.screen=state.stack.pop();else state.screen='home';render()}
function navUpdate(screen=state.screen){const nav=document.querySelector('.nav'),tabs=['home','history','exchange'],index=tabs.indexOf(screen);nav.style.setProperty('--active-nav-index',Math.max(0,index));nav.classList.toggle('no-active',index<0);document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.tab===screen));nav.style.display=screen==='deposit'?'none':'grid'}
function animateBalance(from,to){if(from===to)return;const nodes=document.querySelectorAll('[data-balance-value]');const start=performance.now(),duration=360;function tick(now){const t=Math.min(1,(now-start)/duration),eased=1-Math.pow(1-t,3),value=from+(to-from)*eased;nodes.forEach(node=>node.textContent=fmt(value));if(t<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)}function render(){const el=$('#screen');navUpdate();$('#swipePreview').innerHTML='';$('#swipePreview').classList.remove('is-visible');if(state.loading){el.innerHTML='<div class="skeleton"></div><div class="skeleton" style="margin-top:14px"></div>';return}const views={home:homeView,exchange:exchangeView,history:historyView,account:accountView,wallet:walletView,deposit:depositView};el.innerHTML=(views[state.screen]||homeView)();$('#miniName').textContent=state.user?.firstName||'Профиль';$('#miniAvatar').innerHTML=state.user?.avatar?`<img src="${esc(state.user.avatar)}" alt="">`:esc((state.user?.firstName||'T')[0].toUpperCase());$('#headerBalance').textContent=fmt(state.balance);if(state.balanceAnimationFrom!==null){animateBalance(state.balanceAnimationFrom,state.balance);state.balanceAnimationFrom=null}bindInputs()}
function homeView(){return `<div class="links"><button class="link-card" data-action="channel"><div class="glyph telegram-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 4.5 17.8 20c-.2 1.1-.8 1.3-1.6.8l-4.5-3.3-2.2 2.1c-.2.2-.4.4-.8.4l.3-4.6 8.4-7.6c.4-.4-.1-.5-.6-.2L6.4 14.2l-4.4-1.4c-1-.3-1-1 .2-1.5L19.4 4c.9-.3 1.8.2 1.6.5Z"/></svg></div><b>Канал</b><small>Новости и обновления TONIX</small></button><button class="link-card" data-action="reviews"><div class="glyph">✧</div><b>Отзывы</b><small>Мнение пользователей TONIX</small></button></div><div class="home-core" aria-hidden="true"><div class="core-orbit"></div></div><div class="card rate"><div><small>Курс USDT</small><div style="font-weight:550;margin-top:3px;font-size:12px;color:var(--muted)">1 USDT</div></div><strong>${fmt(state.rate,0)} ₽</strong></div><button class="btn primary" data-action="exchange">Обменять <span aria-hidden="true">→</span></button><div class="section-head"><h2 style="margin:0">Ваш кошелёк</h2><button class="quiet" data-action="wallet">Открыть</button></div><div class="card panel"><div class="label">Доступно</div><div style="font-size:25px;font-weight:650;margin-top:7px">${fmt(availableBalance())} <span style="font-size:14px;color:var(--muted)">USDT</span></div></div>`}
function exchangeView(){const n=Number(state.amount)||0,micro=parseMicro(state.amount),err=state.amount&&micro===null?'Введите сумму с точностью до 6 знаков':(micro!==null&&micro>availableMicro()?'Недостаточно доступных средств':(state.amount&&micro===0n?'Введите сумму больше нуля':''));return `<h1>Обмен</h1><p class="subtitle">Создайте заявку на обмен USDT</p><div class="balance-card"><small>Доступный баланс</small><strong>${fmt(availableBalance())} USDT</strong><button class="btn" style="background:rgba(255,255,255,.2);color:#fff;min-height:42px" data-action="deposit">Пополнить</button></div><div class="card panel"><h2>Создание заявки</h2><div class="field"><label for="amount">Количество USDT <button class="all-btn" data-action="all" ${availableMicro()===0n?'disabled':''}>Все</button></label><div class="input-wrap"><input id="amount" inputmode="decimal" autocomplete="off" placeholder="0.00" value="${esc(state.amount)}"><span class="input-suffix">USDT</span></div><div class="error-text">${err}</div></div><div class="estimate"><span>Вы получите</span><strong id="estimate">${rubText(state.amount)}</strong></div><div class="field"><label for="card">Карта для получения</label><div class="input-wrap"><span class="card-icon">▤</span><input id="card" inputmode="numeric" autocomplete="cc-number" placeholder="0000 0000 0000 0000" value="${esc(state.card)}"></div><div class="helper">Номер карты сохранится на этом устройстве для следующего обмена.</div></div><button class="btn primary" data-action="review-exchange" ${(!n||!!err||digits(state.card).length<12)?'disabled':''}>Создать заявку</button></div>`}
function historyView(){const rows=state.history||[];return `<h1>История</h1><p class="subtitle">Ваши операции</p>${rows.length?rows.map(x=>`<div class="card history-item"><div><b>${esc(x.type||'Обмен')}</b><small style="display:block;margin-top:5px">${fmt(x.amountUSDT||0)} USDT · ${fmt(x.amountRUB||0,0)} ₽</small></div><span class="badge ${x.status==='PENDING'||x.status==='WAITING_PAYMENT'?'pending':''}">${esc(statusText(x.status))}</span><small>${esc(dateText(x.createdAt))}</small><small style="text-align:right">${Number(x.rate)>0?`Курс ${fmt(x.rate,0)} ₽`:''}</small></div>`).join(''):`<div class="card empty"><div style="font-size:30px">↺</div><b>История пока пуста</b><span>Завершённые операции появятся здесь</span></div>`}`}
function statusText(s){return({COMPLETED:'Выполнено',APPROVED:'Зачислено',PENDING:'На проверке',WAITING_PAYMENT:'Ожидает подтверждения',WAITING_MANAGER_REVIEW:'Проверка',REJECTED:'Отклонено',CANCELLED:'Отменено'})[s]||'В обработке'}function dateText(d){if(!d)return'Сейчас';return new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(d))}
function accountView(){const u=state.user||{},historyCount=state.history.length;return `<section class="profile-hero"><div class="profile-avatar-ring">${avatarMarkup(u,true)}</div><h1>${esc(u.firstName||'Пользователь')}</h1><p>${u.username?'@'+esc(u.username):'Telegram аккаунт'}</p><span class="tonix-badge">TONIX ACCOUNT</span></section><button class="profile-balance card" data-action="wallet"><span>Баланс</span><strong><span class="live-balance-value" data-balance-value>${fmt(state.balance)}</span> <small>USDT</small></strong><em>≈ ${rubText(state.balance)}</em></button><div class="section-head"><h2 style="margin:0">Статистика</h2></div><div class="profile-grid"><div class="profile-stat card"><span>Сделки</span><strong>${state.stats.transactionsCount||0}</strong></div><div class="profile-stat card"><span>Оборот USDT</span><strong>${fmt(state.stats.usdtTurnover||0)} <small>USDT</small></strong></div><div class="profile-stat card"><span>Оборот RUB</span><strong>${fmt(state.stats.rubTurnover||0,0)} ₽</strong></div><div class="profile-stat card"><span>История</span><strong class="stat-status">${historyCount?`${historyCount} операций`:'Пока пусто'}</strong></div></div>${historyCount?'':`<div class="profile-empty card"><span>История пока пуста</span><button class="quiet" data-action="exchange">Обменять USDT →</button></div>`}`}
function walletView(){return `<div class="wallet-heading"><div><h1>Кошелёк</h1><p class="subtitle">Ваш TONIX Wallet</p></div><span class="tonix-badge">TONIX</span></div><section class="wallet-card"><div class="wallet-card-top"><span>TONIX</span><span class="wallet-card-orb" aria-hidden="true"></span></div><div class="wallet-balance-label">Баланс</div><strong class="wallet-balance"><span class="live-balance-value" data-balance-value>${fmt(state.balance)}</span> <small>USDT</small></strong><div class="wallet-rub">≈ ${rubText(state.balance)}</div><div class="wallet-card-foot"><span>Доступно ${fmt(availableBalance())} USDT</span><span class="wallet-sigil" aria-hidden="true">◌</span></div></section><div class="wallet-actions"><button class="wallet-action" data-action="wallet-deposit"><span class="action-icon">＋</span><b>Пополнить</b></button><button class="wallet-action" data-action="withdraw"><span class="action-icon">↗</span><b>Вывести</b></button></div><p class="wallet-note">Пополнение зачисляется после проверки.</p>`}
function depositView(){return `<button class="quiet" data-action="back">‹ Назад</button><h1>Пополнение USDT</h1><p class="subtitle">Введите чек из CryptoBot</p><div class="card panel"><div class="field"><label for="check">Чек из CryptoBot</label><div class="input-wrap"><input id="check" autocomplete="off" placeholder="Вставьте ссылку или чек" value="${esc(state.check)}"></div><div class="helper">Баланс не изменится сразу. Заявку проверит администратор.</div></div><button class="btn primary" data-action="submit-deposit" ${!state.check.trim()?'disabled':''}>Отправить чек</button></div>`}
function digits(s){return String(s||'').replace(/\D/g,'')}function formatCard(v){return digits(v).slice(0,19).replace(/(.{4})/g,'$1 ').trim()}
function bindInputs(){const amount=$('#amount');if(amount)amount.oninput=()=>{let clean=amount.value.replace(',','.').replace(/[^\d.]/g,'');if(clean.startsWith('.'))clean='0'+clean;state.amount=clean;const n=Number(clean)||0,micro=parseMicro(clean);$('#estimate').textContent=rubText(clean);const e=amount.closest('.field').querySelector('.error-text');e.textContent=clean&&micro===null?'Введите сумму с точностью до 6 знаков':(micro!==null&&micro>availableMicro()?'Недостаточно доступных средств':(clean&&micro===0n?'Введите сумму больше нуля':''));const btn=document.querySelector('[data-action="review-exchange"]');if(btn)btn.disabled=!micro||micro===0n||!!e.textContent||digits(state.card).length<12};const card=$('#card');if(card)card.oninput=()=>{const pos=card.selectionStart;state.card=formatCard(card.value);card.value=state.card;try{localStorage.setItem('tonix_card',state.card)}catch{}card.setSelectionRange(Math.min(pos+Math.floor(pos/4),state.card.length),Math.min(pos+Math.floor(pos/4),state.card.length));const btn=document.querySelector('[data-action="review-exchange"]');const micro=parseMicro(state.amount);if(btn)btn.disabled=!micro||micro===0n||micro>availableMicro()||digits(state.card).length<12};const check=$('#check');if(check)check.oninput=()=>{state.check=check.value;document.querySelector('[data-action="submit-deposit"]').disabled=!check.value.trim()}}
function depositSheet(){state.check='';modal(`<div class="handle"></div><h2>Пополнение</h2><p class="subtitle">USDT · Введите чек из CryptoBot</p><div class="field"><label for="check">Чек из CryptoBot</label><div class="input-wrap"><input id="check" autocomplete="off" placeholder="Вставьте ссылку или чек"></div><div class="helper">Баланс изменится только после подтверждения пополнения.</div></div><button class="btn primary" data-action="submit-deposit" disabled>Проверить <span>→</span></button><button class="sheet-cancel" data-action="cancel-modal">Отмена</button>`);bindInputs()}function modal(html){$('#modal').innerHTML=`<div class="modal-backdrop" data-action="dismiss-modal"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;haptic('soft')}
function closeModal(){$('#modal').innerHTML=''}
async function createExchange(){const amountMicro=parseMicro(state.amount),card=digits(state.card);if(!amountMicro||amountMicro>availableMicro()||card.length<12){closeModal();toast('Проверьте сумму и номер карты');return}closeModal();try{state.loading=true;render();const result=await api('/api/exchanges',{amountUSDT:state.amount,cardNumber:card});if(!result)throw new Error('Сначала настройте API_URL и подключите backend. Заявка не создана.');const previousBalance=state.balance;state.balance=result.wallet.balanceUSDT;state.reserved=result.wallet.reservedUSDT;if(state.balance!==previousBalance)state.balanceAnimationFrom=previousBalance;toast(result.botMessageSent?'Заявка создана. Продолжите в чате бота.':'Заявка создана, но бот не прислал сообщение. Проверьте /start у бота и Telegram Bot Token.');state.amount='';try{localStorage.setItem('tonix_card',formatCard(card))}catch{}if(tg){tg.HapticFeedback?.notificationOccurred('success');openBot(result.id)}state.screen='exchange'}catch(e){toast(e.message)}finally{state.loading=false;render()}}
function botUrl(startParam){return CONFIG.BOT_USERNAME?`https://t.me/${CONFIG.BOT_USERNAME}${startParam?'?start='+encodeURIComponent(startParam):''}`:''}function openBot(param=''){const url=botUrl(param);if(!url){toast('Переход в бота будет доступен после настройки BOT_USERNAME');return}document.body.classList.add('leaving');setTimeout(()=>{if(tg?.openTelegramLink)tg.openTelegramLink(url);else location.href=url;setTimeout(()=>document.body.classList.remove('leaving'),500)},150)}
async function submitDeposit(){const check=state.check.trim();if(!check)return;closeModal();try{state.loading=true;render();const r=await api('/api/deposits',{cryptoBotCheck:check});if(!r)throw new Error('Сначала настройте API_URL и подключите backend. Чек не отправлен.');toast(r.notificationSent?'Заявка отправлена администраторам на проверку':'Заявка сохранена, но уведомление не доставлено. Проверьте настройки бота и чаты администраторов.');state.check='';state.screen='wallet'}catch(e){toast(e.message)}finally{state.loading=false;render()}}

const swipeOrder=['home','history','exchange','wallet','account'];let activeSwipe=null,swipeSettling=false;const swipeScreen=$('#screen'),swipePreview=$('#swipePreview');const screenViews={home:homeView,history:historyView,exchange:exchangeView,wallet:walletView,account:accountView};function adjacentScreen(name,step){const i=swipeOrder.indexOf(name);return swipeOrder[i+step]||null}function prepareSwipePreview(name,step,width){const next=adjacentScreen(name,step);if(!next){swipePreview.innerHTML='';swipePreview.classList.remove('is-visible');return null}swipePreview.innerHTML=screenViews[next]();swipePreview.classList.add('is-visible');swipePreview.style.transition='none';swipePreview.style.transform=`translate3d(${step*width}px,0,0) scale(.99)`;swipePreview.style.opacity='.72';return next}function resetSwipeStyles(){swipeScreen.style.transition='';swipeScreen.style.transform='';swipeScreen.style.opacity='';swipePreview.style.transition='';swipePreview.style.transform='';swipePreview.style.opacity='';swipePreview.classList.remove('is-visible');swipePreview.innerHTML=''}swipeScreen.addEventListener('pointerdown',e=>{if(swipeSettling||!e.isPrimary||e.button>0||e.target.closest('input,textarea,select,button,[role=button],a,#modal'))return;activeSwipe={id:e.pointerId,startX:e.clientX,startY:e.clientY,lastX:e.clientX,lastAt:performance.now(),locked:false,step:0,next:null,width:swipeScreen.getBoundingClientRect().width};try{swipeScreen.setPointerCapture(e.pointerId)}catch{}});swipeScreen.addEventListener('pointermove',e=>{const g=activeSwipe;if(!g||g.id!==e.pointerId)return;const dx=e.clientX-g.startX,dy=e.clientY-g.startY;if(!g.locked){if(Math.abs(dx)<9&&Math.abs(dy)<9)return;if(Math.abs(dy)>Math.abs(dx)*1.12){activeSwipe=null;return}if(Math.abs(dx)<Math.abs(dy)*1.18)return;g.locked=true;swipeScreen.classList.add('is-dragging')}const nextStep=dx<0?1:-1;if(g.step!==nextStep){g.step=nextStep;g.next=prepareSwipePreview(state.screen,g.step,g.width)}const hasTarget=!!g.next,offset=hasTarget?dx:dx*.18;e.preventDefault();g.lastX=e.clientX;g.lastAt=performance.now();swipeScreen.style.transition='none';swipeScreen.style.transform=`translate3d(${offset}px,0,0) scale(${1-Math.min(.012,Math.abs(offset)/g.width*.012)})`;swipeScreen.style.opacity=String(1-Math.min(.12,Math.abs(offset)/g.width*.12));if(hasTarget){swipePreview.style.transform=`translate3d(${g.step*g.width+dx}px,0,0) scale(${.99+Math.min(.01,Math.abs(dx)/g.width*.01)})`;swipePreview.style.opacity=String(.72+Math.min(.28,Math.abs(dx)/g.width*.28))}}, {passive:false});function finishSwipe(e){const g=activeSwipe;if(!g||g.id!==e.pointerId)return;activeSwipe=null;swipeScreen.classList.remove('is-dragging');if(!g.locked){resetSwipeStyles();return}const dx=e.clientX-g.startX,elapsed=Math.max(1,performance.now()-g.lastAt),velocity=(e.clientX-g.lastX)/elapsed,commit=!!g.next&&(Math.abs(dx)>g.width*.23||(Math.abs(dx)>45&&Math.abs(velocity)>.45));swipeSettling=true;swipeScreen.style.transition='transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s ease';swipePreview.style.transition='transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s ease';if(commit){const target=g.next,finalX=g.step>0?-g.width:g.width;swipeScreen.style.transform=`translate3d(${finalX}px,0,0) scale(.99)`;swipeScreen.style.opacity='.6';swipePreview.style.transform='translate3d(0,0,0) scale(1)';swipePreview.style.opacity='1';navUpdate(target);haptic('light');setTimeout(()=>{state.screen=target;state.stack=[];resetSwipeStyles();swipeSettling=false;render();window.scrollTo({top:0,behavior:'auto'})},230)}else{swipeScreen.style.transform='translate3d(0,0,0) scale(1)';swipeScreen.style.opacity='1';swipePreview.style.transform=`translate3d(${g.step*g.width}px,0,0) scale(.99)`;swipePreview.style.opacity='.72';setTimeout(()=>{resetSwipeStyles();swipeSettling=false},230)}}function cancelSwipe(e){const g=activeSwipe;if(!g||g.id!==e.pointerId)return;activeSwipe=null;swipeScreen.classList.remove('is-dragging');if(!g.locked){resetSwipeStyles();return}swipeSettling=true;swipeScreen.style.transition='transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s ease';swipePreview.style.transition='transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s ease';swipeScreen.style.transform='translate3d(0,0,0) scale(1)';swipeScreen.style.opacity='1';swipePreview.style.transform=`translate3d(${g.step*g.width}px,0,0) scale(.99)`;swipePreview.style.opacity='.72';setTimeout(()=>{resetSwipeStyles();swipeSettling=false},230)}swipeScreen.addEventListener('pointerup',finishSwipe);swipeScreen.addEventListener('pointercancel',cancelSwipe);
document.addEventListener('click',async e=>{const tab=e.target.closest('[data-tab]');if(tab){go(tab.dataset.tab,true);return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='retry-load'){load();return}if(a==='dismiss-modal'){if(e.target===b)closeModal();return}haptic();if(a==='account')go('account');else if(a==='wallet')go('wallet');else if(a==='wallet-deposit')depositSheet();else if(a==='exchange')go('exchange',true);else if(a==='history')go('history',true);else if(a==='deposit')go('deposit');else if(a==='back')back();else if(a==='all'){state.amount=formatMicro(availableMicro());render()}else if(a==='withdraw')openBot();else if(a==='channel'||a==='reviews'){const url=a==='channel'?CONFIG.CHANNEL_URL:CONFIG.REVIEWS_URL;if(url){if(tg?.openTelegramLink)tg.openTelegramLink(url);else window.open(url,'_blank','noopener')}else toast('Ссылка будет добавлена в конфигурацию позже')}else if(a==='review-exchange'){const amountMicro=parseMicro(state.amount),amount=Number(state.amount),last=digits(state.card).slice(-4);if(!amountMicro||amountMicro>availableMicro()||digits(state.card).length<12)return;modal(`<div class="handle"></div><h2>Создать заявку?</h2><div class="metric"><span>Количество</span><strong>${fmt(amount)} USDT</strong></div><div class="metric"><span>Курс</span><strong>${fmt(state.rate,0)} ₽</strong></div><div class="metric"><span>К получению</span><strong>${rubText(state.amount)}</strong></div><div class="metric"><span>Карта</span><strong>•••• ${last}</strong></div><p class="helper">USDT будут зарезервированы сервером. После создания продолжите в Telegram-боте.</p><button class="btn primary" data-action="confirm-exchange">Создать заявку</button><button class="btn" style="width:100%;background:transparent" data-action="cancel-modal">Отмена</button>`)}else if(a==='cancel-modal')closeModal();else if(a==='confirm-exchange')createExchange();else if(a==='submit-deposit')submitDeposit()});
