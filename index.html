<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f4f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><title>TONIX</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light dark;--bg:#f4f5f7;--card:rgba(255,255,255,.88);--solid:#fff;--text:#17181a;--muted:#858990;--line:rgba(60,60,67,.12);--blue:#3478f6;--green:#24a36a;--red:#e55353;--tint:#eef3ff;--shadow:0 8px 28px rgba(20,25,38,.055);--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#111214;--card:rgba(31,32,35,.92);--solid:#202124;--text:#f5f5f7;--muted:#9a9da5;--line:rgba(235,235,245,.13);--tint:#202c43;--shadow:0 8px 28px rgba(0,0,0,.22)}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}body{overscroll-behavior:none}button,input{font:inherit}button{color:inherit;border:0;cursor:pointer}#app{max-width:520px;margin:0 auto;min-height:100dvh;padding:calc(10px + var(--safe-top)) 18px calc(96px + var(--safe-bottom));}header{height:58px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:14px}.brand{font-weight:750;letter-spacing:1.4px;font-size:15px}.profile-mini,.balance-pill{background:none;display:flex;align-items:center;gap:9px;padding:4px;min-width:0}.profile-mini{text-align:left}.profile-mini b{font-size:13px;max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.avatar{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#dce8ff,#adc5fc);color:#2859a8;font-weight:700;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.balance-pill{justify-self:end;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:9px 11px;font-weight:700;font-size:12px;box-shadow:var(--shadow)}.balance-pill small{color:var(--muted);font-size:10px;font-weight:600;display:block;text-align:right}.screen{animation:enter .28s cubic-bezier(.2,.8,.2,1)}@keyframes enter{from{opacity:.35;transform:translateY(7px)}to{opacity:1;transform:none}}h1{font-size:25px;letter-spacing:-.5px;margin:18px 0 5px}h2{font-size:18px;margin:0 0 13px;letter-spacing:-.2px}.subtitle{color:var(--muted);font-size:14px;margin:0 0 21px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.links{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:18px 0 15px}.link-card{height:112px;padding:15px;text-align:left;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--card),rgba(115,155,228,.09));border:1px solid var(--line);border-radius:21px;transition:transform .18s}.link-card:active,.btn:active,.nav-btn:active{transform:scale(.975)}.link-card .glyph{font-size:20px;margin-bottom:12px}.link-card b{display:block;font-size:15px}.link-card small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.rate{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;margin:15px 0}.rate small,.label{color:var(--muted);font-size:13px}.rate strong{font-size:21px}.btn{border-radius:16px;min-height:52px;padding:0 18px;font-weight:680;transition:transform .18s,opacity .18s,background .2s}.primary{background:var(--blue);color:white;width:100%;box-shadow:0 8px 18px rgba(52,120,246,.22)}.secondary{background:var(--tint);color:var(--blue)}.quiet{background:transparent;color:var(--blue)}.btn:disabled{opacity:.45;cursor:default}.nav{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:8px 14px calc(8px + var(--safe-bottom));background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(22px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr)}.nav-btn{background:none;border-radius:15px;min-height:55px;color:var(--muted);display:grid;place-content:center;gap:3px;font-size:10px;transition:.2s}.nav-btn span{font-size:19px}.nav-btn.active{color:var(--blue);background:var(--tint);font-weight:650}.panel{padding:18px;margin:13px 0}.section-head{display:flex;align-items:center;justify-content:space-between;margin:17px 0 12px}.metric{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.metric:last-child{border:0}.metric span{color:var(--muted);font-size:13px}.metric strong{font-size:15px}.balance-card{padding:20px;background:linear-gradient(135deg,#397cf5,#5e9aff);color:white;border-radius:23px;margin:18px 0}.balance-card small{opacity:.82}.balance-card strong{display:block;font-size:27px;margin:8px 0 16px;letter-spacing:-.4px}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.action-card{padding:18px;display:flex;align-items:center;gap:15px;width:100%;text-align:left;margin:10px 0;background:var(--card);border:1px solid var(--line);border-radius:20px;min-height:82px}.action-icon{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--tint);font-size:20px}.action-card small{display:block;color:var(--muted);margin-top:4px;font-size:12px}.field{margin:17px 0}.field label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}.input-wrap{display:flex;align-items:center;background:var(--solid);border:1px solid var(--line);border-radius:15px;padding:0 13px;min-height:54px;transition:border .2s}.input-wrap:focus-within{border-color:var(--blue)}input{width:100%;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font-size:16px}input::placeholder{color:#a3a6ad}.input-suffix{color:var(--muted);font-size:13px;margin-left:8px}.all-btn{background:var(--tint);color:var(--blue);border-radius:11px;padding:8px 11px;font-size:12px;font-weight:650;margin-left:8px}.estimate{background:var(--tint);border-radius:16px;padding:15px 16px;margin:15px 0;display:flex;justify-content:space-between;align-items:center}.estimate span{font-size:13px;color:var(--muted)}.estimate strong{font-size:20px}.notice{padding:13px 14px;background:rgba(229,83,83,.1);color:var(--red);border-radius:14px;font-size:13px;margin:10px 0}.toast{position:fixed;z-index:9;top:calc(14px + var(--safe-top));left:50%;transform:translate(-50%,-15px);background:#242529;color:white;padding:12px 17px;border-radius:14px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.history-item{padding:15px;margin:10px 0;display:grid;grid-template-columns:1fr auto;gap:5px 12px}.history-item small{color:var(--muted)}.badge{align-self:start;border-radius:20px;padding:6px 9px;background:rgba(36,163,106,.12);color:var(--green);font-size:11px;font-weight:650}.badge.pending{background:rgba(230,157,48,.14);color:#bb7b11}.empty{text-align:center;padding:42px 14px;color:var(--muted)}.empty b{display:block;color:var(--text);margin:12px 0 5px}.profile-hero{text-align:center;padding:20px 12px}.profile-hero .avatar{width:80px;height:80px;margin:0 auto 12px;font-size:25px}.profile-hero h2{margin:0 0 4px}.profile-hero p{color:var(--muted);margin:0;font-size:13px}.skeleton{height:98px;border-radius:20px;background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200%;animation:shine 1.2s infinite}@keyframes shine{to{background-position:-200%}}.modal-backdrop{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.38);backdrop-filter:blur(7px);display:flex;align-items:flex-end;justify-content:center;padding:16px 12px calc(14px + var(--safe-bottom));animation:fade .18s}.sheet{width:min(500px,100%);border-radius:27px;background:var(--solid);padding:23px 20px 18px;animation:sheet .34s cubic-bezier(.18,.85,.28,1.08)}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes sheet{from{transform:translateY(35px) scale(.98)}to{transform:none}}.sheet h2{font-size:21px}.sheet .btn{margin-top:9px}.handle{width:37px;height:4px;border-radius:4px;background:var(--line);margin:-11px auto 18px}.helper{font-size:12px;color:var(--muted);line-height:1.45}.error-text{color:var(--red);font-size:12px;margin-top:7px;min-height:15px}.card-icon{font-size:16px;letter-spacing:1px;color:var(--muted)}@media(max-height:700px){h1{margin-top:10px}.links{margin:12px 0}.link-card{height:100px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head>
<body><main id="app"><header><button class="profile-mini" data-action="account"><div class="avatar" id="miniAvatar">T</div><b id="miniName">Профиль</b></button><div class="brand">TONIX</div><button class="balance-pill" data-action="wallet"><div><span id="headerBalance">—</span><small>USDT</small></div></button></header><section id="screen" class="screen"></section></main><nav class="nav" aria-label="Навигация"><button class="nav-btn active" data-tab="home"><span>⌂</span>Главная</button><button class="nav-btn" data-tab="history"><span>↺</span>История</button><button class="nav-btn" data-tab="exchange"><span>⇄</span>Обмен</button></nav><div id="toast" class="toast" role="status"></div><div id="modal"></div>
<script>
(()=>{'use strict';
const CONFIG=Object.freeze({BOT_USERNAME:'TONIX1Bot',USDT_RATE:98,CHANNEL_URL:'',REVIEWS_URL:'',API_URL:'https://klfdfbln.onrender.com/',DEV_MOCK:false});
const tg=window.Telegram?.WebApp;const $=s=>document.querySelector(s);const state={screen:'home',stack:[],user:null,balance:0,reserved:0,stats:{transactionsCount:0,usdtTurnover:0,rubTurnover:0},history:[],rate:CONFIG.USDT_RATE,amount:'',card:'',check:'',loading:false,api:false};
const fmt=(n,d=2)=>new Intl.NumberFormat('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d}).format(Number(n)||0);const haptic=(kind='light')=>{try{tg?.HapticFeedback?.impactOccurred(kind)}catch{}};const toast=(s)=>{const el=$('#toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)};
function initTelegram(){if(!tg)return;tg.ready();tg.expand();tg.setHeaderColor?.('bg_color');tg.setBackgroundColor?.('bg_color');tg.onEvent?.('themeChanged',applyTheme);tg.onEvent?.('viewportChanged',()=>document.documentElement.style.setProperty('--tg-viewport-height',(tg.viewportStableHeight||tg.viewportHeight)+'px'));applyTheme();}
function applyTheme(){if(!tg)return;const p=tg.themeParams||{};for(const [key,val] of Object.entries({bg_color:'--bg',secondary_bg_color:'--card',text_color:'--text',hint_color:'--muted',button_color:'--blue'})){if(p[key])document.documentElement.style.setProperty(val,p[key])}}
function mockUser(){const u=tg?.initDataUnsafe?.user;if(u)return{telegramId:u.id,username:u.username||'',firstName:u.first_name||'Пользователь',avatar:u.photo_url||''};if(CONFIG.DEV_MOCK&&location.hostname!=='')return{telegramId:0,username:'demo',firstName:'Демо',avatar:''};return{telegramId:null,username:'',firstName:'Гость',avatar:''}}
const api=async(path,body)=>{if(!CONFIG.API_URL)return null;const init={method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''},...(body?{body:JSON.stringify(body)}:{})};const r=await fetch(CONFIG.API_URL.replace(/\/$/,'')+path,init);const data=await r.json().catch(()=>({error:'Ошибка ответа сервера'}));if(!r.ok)throw new Error(data.error||'Не удалось выполнить запрос');return data};
async function load(){state.user=mockUser();try{const data=await api('/api/me');if(data){state.api=true;state.user=data.user;state.balance=data.wallet.balanceUSDT;state.reserved=data.wallet.reservedUSDT;state.stats=data.statistics;state.history=data.history||[];state.rate=data.rate||CONFIG.USDT_RATE}}catch(e){toast(e.message)}try{state.card=localStorage.getItem('tonix_card')||''}catch{}render();}
function avatarMarkup(user,large=false){const cls=large?'avatar':'avatar';return user.avatar?`<div class="${cls}"><img src="${esc(user.avatar)}" alt=""></div>`:`<div class="${cls}">${esc((user.firstName||'T').slice(0,1).toUpperCase())}</div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(name,fromNav=false){if(!['home','exchange','history'].includes(state.screen))state.stack.push(state.screen);state.screen=name;if(fromNav)state.stack=[];haptic();render();window.scrollTo({top:0,behavior:'smooth'});}
function back(){if(state.stack.length)state.screen=state.stack.pop();else state.screen='home';render()}
function navUpdate(){document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.tab===state.screen));document.querySelector('.nav').style.display=['account','wallet','deposit'].includes(state.screen)?'none':'grid'}
function render(){const el=$('#screen');navUpdate();if(state.loading){el.innerHTML='<div class="skeleton"></div><div class="skeleton" style="margin-top:14px"></div>';return}const views={home:homeView,exchange:exchangeView,history:historyView,account:accountView,wallet:walletView,deposit:depositView};el.innerHTML=(views[state.screen]||homeView)();$('#miniName').textContent=state.user?.firstName||'Профиль';$('#miniAvatar').innerHTML=state.user?.avatar?`<img src="${esc(state.user.avatar)}" alt="">`:esc((state.user?.firstName||'T')[0].toUpperCase());$('#headerBalance').textContent=fmt(state.balance);bindInputs()}
function homeView(){return `<div class="links"><button class="link-card" data-action="channel"><div class="glyph">◉</div><b>Канал</b><small>Новости TONIX</small></button><button class="link-card" data-action="reviews"><div class="glyph">✧</div><b>Отзывы</b><small>Опыт пользователей</small></button></div><div class="card rate"><div><small>Текущий курс</small><div style="font-weight:650;margin-top:4px">1 USDT</div></div><strong>${fmt(state.rate,0)} ₽</strong></div><button class="btn primary" data-action="exchange">Обменять <span aria-hidden="true">→</span></button><div class="section-head"><h2 style="margin:0">Ваш кошелёк</h2><button class="quiet" data-action="wallet">Открыть</button></div><div class="card panel"><div class="label">Доступно</div><div style="font-size:25px;font-weight:730;margin-top:7px">${fmt(Math.max(0,state.balance-state.reserved))} <span style="font-size:14px;color:var(--muted)">USDT</span></div></div>`}
function exchangeView(){const n=Number(state.amount)||0,err=n>state.balance-state.reserved?'Недостаточно доступных средств':(state.amount&&n<=0?'Введите сумму больше нуля':'');return `<h1>Обмен</h1><p class="subtitle">Создайте заявку на обмен USDT</p><div class="balance-card"><small>Доступный баланс</small><strong>${fmt(Math.max(0,state.balance-state.reserved))} USDT</strong><button class="btn" style="background:rgba(255,255,255,.2);color:#fff;min-height:42px" data-action="deposit">Пополнить</button></div><div class="card panel"><h2>Создание заявки</h2><div class="field"><label for="amount">Количество USDT <button class="all-btn" data-action="all">Все</button></label><div class="input-wrap"><input id="amount" inputmode="decimal" autocomplete="off" placeholder="0.00" value="${esc(state.amount)}"><span class="input-suffix">USDT</span></div><div class="error-text">${err}</div></div><div class="estimate"><span>Вы получите</span><strong id="estimate">${fmt(n*state.rate,0)} ₽</strong></div><div class="field"><label for="card">Карта для получения</label><div class="input-wrap"><span class="card-icon">▤</span><input id="card" inputmode="numeric" autocomplete="cc-number" placeholder="0000 0000 0000 0000" value="${esc(state.card)}"></div><div class="helper">Номер карты сохранится на этом устройстве для следующего обмена.</div></div><button class="btn primary" data-action="review-exchange" ${(!n||!!err||digits(state.card).length<12)?'disabled':''}>Создать заявку</button></div>`}
function historyView(){const rows=state.history||[];return `<h1>История</h1><p class="subtitle">Ваши операции</p>${rows.length?rows.map(x=>`<div class="card history-item"><div><b>${esc(x.type||'Обмен')}</b><small style="display:block;margin-top:5px">${fmt(x.amountUSDT||0)} USDT · ${fmt(x.amountRUB||0,0)} ₽</small></div><span class="badge ${x.status==='PENDING'||x.status==='WAITING_PAYMENT'?'pending':''}">${esc(statusText(x.status))}</span><small>${esc(dateText(x.createdAt))}</small><small style="text-align:right">Курс ${fmt(x.rate||state.rate,0)} ₽</small></div>`).join(''):`<div class="card empty"><div style="font-size:30px">↺</div><b>История пока пуста</b><span>Завершённые операции появятся здесь</span></div>`}`}
function statusText(s){return({COMPLETED:'Выполнено',APPROVED:'Зачислено',PENDING:'На проверке',WAITING_PAYMENT:'Ожидает подтверждения',WAITING_MANAGER_REVIEW:'Проверка',REJECTED:'Отклонено',CANCELLED:'Отменено'})[s]||'В обработке'}function dateText(d){if(!d)return'Сейчас';return new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(d))}
function accountView(){const u=state.user||{};return `<button class="quiet" data-action="back">‹ Назад</button><div class="card profile-hero">${avatarMarkup(u,true)}<h2>${esc(u.firstName||'Пользователь')}</h2><p>${u.username?'@'+esc(u.username):'Telegram аккаунт'}</p></div><div class="card panel"><div class="section-head" style="margin:0 0 8px"><h2 style="margin:0">Баланс</h2><button class="quiet" data-action="wallet">Кошелёк</button></div><div style="font-size:24px;font-weight:720">${fmt(state.balance)} USDT</div></div><div class="section-head"><h2 style="margin:0">Статистика</h2></div><div class="card panel"><div class="metric"><span>Количество сделок</span><strong>${state.stats.transactionsCount||0}</strong></div><div class="metric"><span>Оборот USDT</span><strong>${fmt(state.stats.usdtTurnover||0)} USDT</strong></div><div class="metric"><span>Оборот в рублях</span><strong>${fmt(state.stats.rubTurnover||0,0)} ₽</strong></div></div>`}
function walletView(){return `<button class="quiet" data-action="back">‹ Назад</button><h1>Кошелёк</h1><p class="subtitle">Доступно ${fmt(Math.max(0,state.balance-state.reserved))} USDT</p><button class="action-card" data-action="deposit"><span class="action-icon">＋</span><span><b>Пополнить</b><small>Зачисление после проверки администратором</small></span><span style="margin-left:auto">›</span></button><button class="action-card" data-action="withdraw"><span class="action-icon">↗</span><span><b>Вывод</b><small>Перейти в чат TONIX в Telegram</small></span><span style="margin-left:auto">›</span></button>`}
function depositView(){return `<button class="quiet" data-action="back">‹ Назад</button><h1>Пополнение USDT</h1><p class="subtitle">Введите чек из CryptoBot</p><div class="card panel"><div class="field"><label for="check">Чек из CryptoBot</label><div class="input-wrap"><input id="check" autocomplete="off" placeholder="Вставьте ссылку или чек" value="${esc(state.check)}"></div><div class="helper">Баланс не изменится сразу. Заявку проверит администратор.</div></div><button class="btn primary" data-action="submit-deposit" ${!state.check.trim()?'disabled':''}>Отправить чек</button></div>`}
function digits(s){return String(s||'').replace(/\D/g,'')}function formatCard(v){return digits(v).slice(0,19).replace(/(.{4})/g,'$1 ').trim()}
function bindInputs(){const amount=$('#amount');if(amount)amount.oninput=()=>{const clean=amount.value.replace(',','.').replace(/[^\d.]/g,'');state.amount=clean;const n=Number(clean)||0;$('#estimate').textContent=fmt(n*state.rate,0)+' ₽';const e=amount.closest('.field').querySelector('.error-text');e.textContent=n>state.balance-state.reserved?'Недостаточно доступных средств':(clean&&n<=0?'Введите сумму больше нуля':'');const btn=document.querySelector('[data-action="review-exchange"]');if(btn)btn.disabled=!n||!!e.textContent||digits(state.card).length<12};const card=$('#card');if(card)card.oninput=()=>{const pos=card.selectionStart;state.card=formatCard(card.value);card.value=state.card;try{localStorage.setItem('tonix_card',state.card)}catch{}card.setSelectionRange(Math.min(pos+Math.floor(pos/4),state.card.length),Math.min(pos+Math.floor(pos/4),state.card.length));const btn=document.querySelector('[data-action="review-exchange"]');if(btn)btn.disabled=!Number(state.amount)||Number(state.amount)>state.balance-state.reserved||digits(state.card).length<12};const check=$('#check');if(check)check.oninput=()=>{state.check=check.value;document.querySelector('[data-action="submit-deposit"]').disabled=!check.value.trim()}}
function modal(html){$('#modal').innerHTML=`<div class="modal-backdrop" data-action="dismiss-modal"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;haptic('soft')}
function closeModal(){$('#modal').innerHTML=''}
async function createExchange(){const amount=Number(state.amount),card=digits(state.card);if(!amount||amount>state.balance-state.reserved||card.length<12){closeModal();toast('Проверьте сумму и номер карты');return}closeModal();try{state.loading=true;render();const result=await api('/api/exchanges',{amountUSDT:amount,cardNumber:card});if(!result)throw new Error('Сначала настройте API_URL и подключите backend. Заявка не создана.');state.balance=result.wallet.balanceUSDT;state.reserved=result.wallet.reservedUSDT;toast('Заявка создана. Продолжите в чате бота.');state.amount='';try{localStorage.setItem('tonix_card',formatCard(card))}catch{}if(tg){tg.HapticFeedback?.notificationOccurred('success');openBot(result.id)}state.screen='exchange'}catch(e){toast(e.message)}finally{state.loading=false;render()}}
function botUrl(startParam){return CONFIG.BOT_USERNAME?`https://t.me/${CONFIG.BOT_USERNAME}${startParam?'?start='+encodeURIComponent(startParam):''}`:''}function openBot(param=''){const url=botUrl(param);if(!url){toast('Переход в бота будет доступен после настройки BOT_USERNAME');return}if(tg?.openTelegramLink)tg.openTelegramLink(url);else location.href=url}
async function submitDeposit(){const check=state.check.trim();if(!check)return;try{state.loading=true;render();const r=await api('/api/deposits',{cryptoBotCheck:check});if(!r)throw new Error('Сначала настройте API_URL и подключите backend. Чек не отправлен.');toast('Заявка отправлена на проверку');state.check='';state.screen='wallet'}catch(e){toast(e.message)}finally{state.loading=false;render()}}
document.addEventListener('click',async e=>{const tab=e.target.closest('[data-tab]');if(tab){go(tab.dataset.tab,true);return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='dismiss-modal'){if(e.target===b)closeModal();return}haptic();if(a==='account')go('account');else if(a==='wallet')go('wallet');else if(a==='exchange')go('exchange',true);else if(a==='history')go('history',true);else if(a==='deposit')go('deposit');else if(a==='back')back();else if(a==='all'){state.amount=String(Math.max(0,state.balance-state.reserved));render()}else if(a==='withdraw')openBot();else if(a==='channel'||a==='reviews'){const url=a==='channel'?CONFIG.CHANNEL_URL:CONFIG.REVIEWS_URL;if(url){if(tg?.openTelegramLink)tg.openTelegramLink(url);else window.open(url,'_blank','noopener')}else toast('Ссылка будет добавлена в конфигурацию позже')}else if(a==='review-exchange'){const amount=Number(state.amount),last=digits(state.card).slice(-4);if(!amount||amount>state.balance-state.reserved||digits(state.card).length<12)return;modal(`<div class="handle"></div><h2>Создать заявку?</h2><div class="metric"><span>Количество</span><strong>${fmt(amount)} USDT</strong></div><div class="metric"><span>Курс</span><strong>${fmt(state.rate,0)} ₽</strong></div><div class="metric"><span>К получению</span><strong>${fmt(amount*state.rate,0)} ₽</strong></div><div class="metric"><span>Карта</span><strong>•••• ${last}</strong></div><p class="helper">USDT будут зарезервированы сервером. После создания продолжите в Telegram-боте.</p><button class="btn primary" data-action="confirm-exchange">Создать заявку</button><button class="btn" style="width:100%;background:transparent" data-action="cancel-modal">Отмена</button>`)}else if(a==='cancel-modal')closeModal();else if(a==='confirm-exchange')createExchange();else if(a==='submit-deposit')submitDeposit()});
if(tg?.BackButton){tg.BackButton.onClick(back);tg.BackButton.show()}document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal').innerHTML)closeModal();else back()}});initTelegram();load();
})();
</script></body></html>
