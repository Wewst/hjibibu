<body><div id="launch" role="status" aria-label="TONIX"><div class="launch-mark"><div class="launch-core" aria-hidden="true"></div><div class="launch-name">TONIX</div></div><div class="launch-error" id="launchError"><strong>Не удалось загрузить TONIX</strong><p id="launchErrorText">Проверьте соединение и попробуйте ещё раз.</p><button type="button" data-action="retry-load">Повторить</button></div></div><main id="app"><header><button class="profile-mini" data-action="account"><div class="avatar" id="miniAvatar">T</div><b id="miniName">Профиль</b></button><div class="brand">TONIX</div><button class="balance-pill" data-action="wallet"><div><span id="headerBalance">—</span><small>USDT</small></div></button></header><section id="screen" class="screen"></section></main><nav class="nav" aria-label="Навигация"><button class="nav-btn active" data-tab="home"><span>⌂</span>Главная</button><button class="nav-btn" data-tab="history"><span>↺</span>История</button><button class="nav-btn" data-tab="exchange"><span>⇄</span>Обмен</button></nav><div id="toast" class="toast" role="status"></div><div id="modal"></div>
<script>
(()=>{'use strict';
const CONFIG=Object.freeze({BOT_USERNAME:'TONIX1Bot',USDT_RATE:98,CHANNEL_URL:'',REVIEWS_URL:'',API_URL:'https://klfdfbln.onrender.com',DEV_MOCK:false});
let tg=window.Telegram?.WebApp;let telegramInitialized=false;const $=s=>document.querySelector(s);const state={screen:'home',stack:[],user:null,balance:0,reserved:0,stats:{transactionsCount:0,usdtTurnover:0,rubTurnover:0},history:[],rate:CONFIG.USDT_RATE,amount:'',card:'',check:'',loading:false,api:false};
const fmt=(n,d=2)=>new Intl.NumberFormat('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d}).format(Number(n)||0);const haptic=(kind='light')=>{try{tg?.HapticFeedback?.impactOccurred(kind)}catch{}};const toast=(s)=>{const el=$('#toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)};
function initTelegram(){if(!tg||telegramInitialized)return;telegramInitialized=true;tg.ready();tg.expand();tg.setHeaderColor?.('#08090c');tg.setBackgroundColor?.('#08090c');tg.onEvent?.('themeChanged',applyTheme);tg.onEvent?.('viewportChanged',()=>document.documentElement.style.setProperty('--tg-viewport-height',(tg.viewportStableHeight||tg.viewportHeight)+'px'));applyTheme();}
function applyTheme(){/* TONIX keeps its own dark palette across Telegram themes. */}

const api=async(path,body)=>{if(!CONFIG.API_URL)return null;const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),20000);const init={method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''},signal:controller.signal,...(body?{body:JSON.stringify(body)}:{})};let r;try{r=await fetch(CONFIG.API_URL.replace(/\/$/,'')+path,init)}catch{throw new Error('Не удалось связаться с API. Проверьте соединение, Render и CORS.')}finally{clearTimeout(timeout)}const data=await r.json().catch(()=>({error:'Ошибка ответа сервера'}));if(!r.ok)throw new Error((data.error||'Не удалось выполнить запрос')+(data.requestId?` · ID ${data.requestId}`:''));return data};
async function load(){tg=window.Telegram?.WebApp||tg;initTelegram();const launch=$('#launch'),error=$('#launchError'),retry=$('[data-action="retry-load"]');retry.disabled=true;error.classList.remove('show');$('#launchErrorText').textContent='Проверьте соединение и попробуйте ещё раз.';launch.setAttribute('aria-busy','true');try{const data=await api('/api/me');if(!data)throw new Error('Сервис TONIX временно недоступен.');state.api=true;state.user=data.user;state.balance=data.wallet.balanceUSDT;state.reserved=data.wallet.reservedUSDT;state.stats=data.statistics;state.history=data.history||[];state.rate=data.rate||CONFIG.USDT_RATE;try{state.card=localStorage.getItem('tonix_card')||''}catch{}render();document.body.classList.add('ready');launch.classList.add('is-exiting');setTimeout(()=>{launch.hidden=true;launch.classList.remove('is-exiting');launch.removeAttribute('aria-busy')},260);if(tg?.HapticFeedback){try{if(!sessionStorage.getItem('tonix_launch_haptic')){tg.HapticFeedback.impactOccurred('light');sessionStorage.setItem('tonix_launch_haptic','1')}}catch{}}}catch(e){retry.disabled=false;$('#launchErrorText').textContent=e.message||'Проверьте соединение и попробуйте ещё раз.';error.classList.add('show');launch.setAttribute('aria-busy','false')}}
function avatarMarkup(user,large=false){const cls=large?'avatar':'avatar';return user.avatar?`<div class="${cls}"><img src="${esc(user.avatar)}" alt=""></div>`:`<div class="${cls}">${esc((user.firstName||'T').slice(0,1).toUpperCase())}</div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(name,fromNav=false){if(!['home','exchange','history'].includes(state.screen))state.stack.push(state.screen);state.screen=name;if(fromNav)state.stack=[];haptic();render();window.scrollTo({top:0,behavior:'smooth'});}
function back(){if(state.stack.length)state.screen=state.stack.pop();else state.screen='home';render()}
function navUpdate(){document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.tab===state.screen));document.querySelector('.nav').style.display=['account','wallet','deposit'].includes(state.screen)?'none':'grid'}
function render(){const el=$('#screen');navUpdate();if(state.loading){el.innerHTML='<div class="skeleton"></div><div class="skeleton" style="margin-top:14px"></div>';return}const views={home:homeView,exchange:exchangeView,history:historyView,account:accountView,wallet:walletView,deposit:depositView};el.innerHTML=(views[state.screen]||homeView)();$('#miniName').textContent=state.user?.firstName||'Профиль';$('#miniAvatar').innerHTML=state.user?.avatar?`<img src="${esc(state.user.avatar)}" alt="">`:esc((state.user?.firstName||'T')[0].toUpperCase());$('#headerBalance').textContent=fmt(state.balance);bindInputs()}
function homeView(){return `<div class="links"><button class="link-card" data-action="channel"><div class="glyph">◉</div><b>Канал</b><small>Новости TONIX</small></button><button class="link-card" data-action="reviews"><div class="glyph">✧</div><b>Отзывы</b><small>Опыт пользователей</small></button></div><div class="home-core" aria-hidden="true"><div class="core-orbit"></div></div><div class="card rate"><div><small>Курс USDT</small><div style="font-weight:550;margin-top:3px;font-size:12px;color:var(--muted)">1 USDT</div></div><strong>${fmt(state.rate,0)} ₽</strong></div><button class="btn primary" data-action="exchange">Обменять <span aria-hidden="true">→</span></button><div class="section-head"><h2 style="margin:0">Ваш кошелёк</h2><button class="quiet" data-action="wallet">Открыть</button></div><div class="card panel"><div class="label">Доступно</div><div style="font-size:25px;font-weight:650;margin-top:7px">${fmt(Math.max(0,state.balance-state.reserved))} <span style="font-size:14px;color:var(--muted)">USDT</span></div></div>`}
function exchangeView(){const n=Number(state.amount)||0,err=n>state.balance-state.reserved?'Недостаточно доступных средств':(state.amount&&n<=0?'Введите сумму больше нуля':'');return `<h1>Обмен</h1><p class="subtitle">Создайте заявку на обмен USDT</p><div class="balance-card"><small>Доступный баланс</small><strong>${fmt(Math.max(0,state.balance-state.reserved))} USDT</strong><button class="btn" style="background:rgba(255,255,255,.2);color:#fff;min-height:42px" data-action="deposit">Пополнить</button></div><div class="card panel"><h2>Создание заявки</h2><div class="field"><label for="amount">Количество USDT <button class="all-btn" data-action="all">Все</button></label><div class="input-wrap"><input id="amount" inputmode="decimal" autocomplete="off" placeholder="0.00" value="${esc(state.amount)}"><span class="input-suffix">USDT</span></div><div class="error-text">${err}</div></div><div class="estimate"><span>Вы получите</span><strong id="estimate">${fmt(n*state.rate,0)} ₽</strong></div><div class="field"><label for="card">Карта для получения</label><div class="input-wrap"><span class="card-icon">▤</span><input id="card" inputmode="numeric" autocomplete="cc-number" placeholder="0000 0000 0000 0000" value="${esc(state.card)}"></div><div class="helper">Номер карты сохранится на этом устройстве для следующего обмена.</div></div><button class="btn primary" data-action="review-exchange" ${(!n||!!err||digits(state.card).length<12)?'disabled':''}>Создать заявку</button></div>`}
function historyView(){const rows=state.history||[];return `<h1>История</h1><p class="subtitle">Ваши операции</p>${rows.length?rows.map(x=>`<div class="card history-item"><div><b>${esc(x.type||'Обмен')}</b><small style="display:block;margin-top:5px">${fmt(x.amountUSDT||0)} USDT · ${fmt(x.amountRUB||0,0)} ₽</small></div><span class="badge ${x.status==='PENDING'||x.status==='WAITING_PAYMENT'?'pending':''}">${esc(statusText(x.status))}</span><small>${esc(dateText(x.createdAt))}</small><small style="text-align:right">Курс ${fmt(x.rate||state.rate,0)} ₽</small></div>`).join(''):`<div class="card empty"><div style="font-size:30px">↺</div><b>История пока пуста</b><span>Завершённые операции появятся здесь</span></div>`}`}
function statusText(s){return({COMPLETED:'Выполнено',APPROVED:'Зачислено',PENDING:'На проверке',WAITING_PAYMENT:'Ожидает подтверждения',WAITING_MANAGER_REVIEW:'Проверка',REJECTED:'Отклонено',CANCELLED:'Отменено'})[s]||'В обработке'}function dateText(d){if(!d)return'Сейчас';return new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(d))}
function accountView(){const u=state.user||{};return `<button class="quiet" data-action="back">‹ Назад</button><div class="card profile-hero">${avatarMarkup(u,true)}<h2>${esc(u.firstName||'Пользователь')}</h2><p>${u.username?'@'+esc(u.username):'Telegram аккаунт'}</p></div><div class="card panel"><div class="section-head" style="margin:0 0 8px"><h2 style="margin:0">Баланс</h2><button class="quiet" data-action="wallet">Кошелёк</button></div><div style="font-size:24px;font-weight:720">${fmt(state.balance)} USDT</div></div><div class="section-head"><h2 style="margin:0">Статистика</h2></div><div class="card panel"><div class="metric"><span>Количество сделок</span><strong>${state.stats.transactionsCount||0}</strong></div><div class="metric"><span>Оборот USDT</span><strong>${fmt(state.stats.usdtTurnover||0)} USDT</strong></div><div class="metric"><span>Оборот в рублях</span><strong>${fmt(state.stats.rubTurnover||0,0)} ₽</strong></div></div>`}
function walletView(){return `<button class="quiet" data-action="back">‹ Назад</button><h1>Кошелёк</h1><p class="subtitle">Доступно ${fmt(Math.max(0,state.balance-state.reserved))} USDT</p><button class="action-card" data-action="deposit"><span class="action-icon">＋</span><span><b>Пополнить</b><small>Зачисление после проверки администратором</small></span><span style="margin-left:auto">›</span></button><button class="action-card" data-action="withdraw"><span class="action-icon">↗</span><span><b>Вывод</b><small>Перейти в чат TONIX в Telegram</small></span><span style="margin-left:auto">›</span></button>`}
function depositView(){return `<button class="quiet" data-action="back">‹ Назад</button><h1>Пополнение USDT</h1><p class="subtitle">Введите чек из CryptoBot</p><div class="card panel"><div class="field"><label for="check">Чек из CryptoBot</label><div class="input-wrap"><input id="check" autocomplete="off" placeholder="Вставьте ссылку или чек" value="${esc(state.check)}"></div><div class="helper">Баланс не изменится сразу. Заявку проверит администратор.</div></div><button class="btn primary" data-action="submit-deposit" ${!state.check.trim()?'disabled':''}>Отправить чек</button></div>`}
function digits(s){return String(s||'').replace(/\D/g,'')}function formatCard(v){return digits(v).slice(0,19).replace(/(.{4})/g,'$1 ').trim()}
function bindInputs(){const amount=$('#amount');if(amount)amount.oninput=()=>{const clean=amount.value.replace(',','.').replace(/[^\d.]/g,'');state.amount=clean;const n=Number(clean)||0;$('#estimate').textContent=fmt(n*state.rate,0)+' ₽';const e=amount.closest('.field').querySelector('.error-text');e.textContent=n>state.balance-state.reserved?'Недостаточно доступных средств':(clean&&n<=0?'Введите сумму больше нуля':'');const btn=document.querySelector('[data-action="review-exchange"]');if(btn)btn.disabled=!n||!!e.textContent||digits(state.card).length<12};const card=$('#card');if(card)card.oninput=()=>{const pos=card.selectionStart;state.card=formatCard(card.value);card.value=state.card;try{localStorage.setItem('tonix_card',state.card)}catch{}card.setSelectionRange(Math.min(pos+Math.floor(pos/4),state.card.length),Math.min(pos+Math.floor(pos/4),state.card.length));const btn=document.querySelector('[data-action="review-exchange"]');if(btn)btn.disabled=!Number(state.amount)||Number(state.amount)>state.balance-state.reserved||digits(state.card).length<12};const check=$('#check');if(check)check.oninput=()=>{state.check=check.value;document.querySelector('[data-action="submit-deposit"]').disabled=!check.value.trim()}}
function modal(html){$('#modal').innerHTML=`<div class="modal-backdrop" data-action="dismiss-modal"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;haptic('soft')}
function closeModal(){$('#modal').innerHTML=''}
async function createExchange(){const amount=Number(state.amount),card=digits(state.card);if(!amount||amount>state.balance-state.reserved||card.length<12){closeModal();toast('Проверьте сумму и номер карты');return}closeModal();try{state.loading=true;render();const result=await api('/api/exchanges',{amountUSDT:amount,cardNumber:card});if(!result)throw new Error('Сначала настройте API_URL и подключите backend. Заявка не создана.');state.balance=result.wallet.balanceUSDT;state.reserved=result.wallet.reservedUSDT;toast(result.botMessageSent?'Заявка создана. Продолжите в чате бота.':'Заявка создана, но бот не прислал сообщение. Проверьте /start у бота и Telegram Bot Token.');state.amount='';try{localStorage.setItem('tonix_card',formatCard(card))}catch{}if(tg){tg.HapticFeedback?.notificationOccurred('success');openBot(result.id)}state.screen='exchange'}catch(e){toast(e.message)}finally{state.loading=false;render()}}
function botUrl(startParam){return CONFIG.BOT_USERNAME?`https://t.me/${CONFIG.BOT_USERNAME}${startParam?'?start='+encodeURIComponent(startParam):''}`:''}function openBot(param=''){const url=botUrl(param);if(!url){toast('Переход в бота будет доступен после настройки BOT_USERNAME');return}if(tg?.openTelegramLink)tg.openTelegramLink(url);else location.href=url}
async function submitDeposit(){const check=state.check.trim();if(!check)return;try{state.loading=true;render();const r=await api('/api/deposits',{cryptoBotCheck:check});if(!r)throw new Error('Сначала настройте API_URL и подключите backend. Чек не отправлен.');toast(r.notificationSent?'Заявка отправлена администраторам на проверку':'Заявка сохранена, но уведомление не доставлено. Проверьте настройки бота и чаты администраторов.');state.check='';state.screen='wallet'}catch(e){toast(e.message)}finally{state.loading=false;render()}}
document.addEventListener('click',async e=>{const tab=e.target.closest('[data-tab]');if(tab){go(tab.dataset.tab,true);return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='retry-load'){load();return}if(a==='dismiss-modal'){if(e.target===b)closeModal();return}haptic();if(a==='account')go('account');else if(a==='wallet')go('wallet');else if(a==='exchange')go('exchange',true);else if(a==='history')go('history',true);else if(a==='deposit')go('deposit');else if(a==='back')back();else if(a==='all'){state.amount=String(Math.max(0,state.balance-state.reserved));render()}else if(a==='withdraw')openBot();else if(a==='channel'||a==='reviews'){const url=a==='channel'?CONFIG.CHANNEL_URL:CONFIG.REVIEWS_URL;if(url){if(tg?.openTelegramLink)tg.openTelegramLink(url);else window.open(url,'_blank','noopener')}else toast('Ссылка будет добавлена в конфигурацию позже')}else if(a==='review-exchange'){const amount=Number(state.amount),last=digits(state.card).slice(-4);if(!amount||amount>state.balance-state.reserved||digits(state.card).length<12)return;modal(`<div class="handle"></div><h2>Создать заявку?</h2><div class="metric"><span>Количество</span><strong>${fmt(amount)} USDT</strong></div><div class="metric"><span>Курс</span><strong>${fmt(state.rate,0)} ₽</strong></div><div class="metric"><span>К получению</span><strong>${fmt(amount*state.rate,0)} ₽</strong></div><div class="metric"><span>Карта</span><strong>•••• ${last}</strong></div><p class="helper">USDT будут зарезервированы сервером. После создания продолжите в Telegram-боте.</p><button class="btn primary" data-action="confirm-exchange">Создать заявку</button><button class="btn" style="width:100%;background:transparent" data-action="cancel-modal">Отмена</button>`)}else if(a==='cancel-modal')closeModal();else if(a==='confirm-exchange')createExchange();else if(a==='submit-deposit')submitDeposit()});
if(tg?.BackButton){tg.BackButton.onClick(back);tg.BackButton.show()}document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal').innerHTML)closeModal();else back()}});let appStarted=false;const startApp=()=>{if(appStarted)return;appStarted=true;tg=window.Telegram?.WebApp||tg;initTelegram();load()};if(tg)startApp();else{const telegramScript=document.querySelector('script[src^="https://telegram.org/js/"]');telegramScript?.addEventListener('load',startApp,{once:true});telegramScript?.addEventListener('error',startApp,{once:true});setTimeout(startApp,1200)}
})();
</script></body></html>
